<!DOCTYPE html>
<html lang="ro">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0f172a">
<title>Test Verkehrssituationen · Test Situații de Trafic (DE / RO)</title>
<style>
  :root {
    --bg: #f8fafc;
    --surface: #ffffff;
    --surface-muted: #f1f5f9;
    --border: #e2e8f0;
    --border-strong: #cbd5e1;
    --text: #0f172a;
    --text-muted: #475569;
    --primary: #0284c7;
    --primary-hover: #0369a1;
    --primary-light: #e0f2fe;
    --success: #059669;
    --success-bg: #ecfdf5;
    --danger: #dc2626;
    --danger-bg: #fef2f2;
    --stage-bg: #0f172a;
    font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    color: var(--text);
    background-color: var(--bg);
    font-size: 16px;
  }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; display: flex; flex-direction: column; }
  button, input, select { font: inherit; }
  button { touch-action: manipulation; cursor: pointer; }
  .topbar {
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    padding: 12px 20px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
    flex-wrap: wrap;
  }
  .brand {
    font-weight: 700;
    font-size: 18px;
    color: var(--text);
    letter-spacing: -0.01em;
  }
  .lang-switch {
    display: inline-flex;
    background: var(--surface-muted);
    padding: 4px;
    border-radius: 8px;
    border: 1px solid var(--border);
    gap: 4px;
  }
  .lang-btn {
    border: 0;
    background: transparent;
    padding: 6px 12px;
    border-radius: 6px;
    font-size: 13px;
    font-weight: 600;
    color: var(--text-muted);
    transition: all 0.15s ease;
  }
  .lang-btn.active {
    background: var(--surface);
    color: var(--text);
    box-shadow: 0 1px 2px rgba(0,0,0,0.06);
  }
  .container {
    width: 100%;
    max-width: 1200px;
    margin: 0 auto;
    padding: clamp(14px, 2.5vw, 28px);
    flex: 1;
  }
  .header-panel {
    display: flex;
    flex-wrap: wrap;
    align-items: flex-end;
    justify-content: space-between;
    gap: 16px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 16px 20px;
    margin-bottom: 20px;
  }
  .settings-group {
    display: flex;
    flex-wrap: wrap;
    gap: 18px;
    align-items: flex-end;
  }
  .field {
    display: flex;
    flex-direction: column;
    gap: 6px;
  }
  .field label {
    font-size: 13px;
    font-weight: 600;
    color: var(--text-muted);
  }
  .field input[type="number"], .field select {
    min-height: 42px;
    border: 1px solid var(--border-strong);
    border-radius: 8px;
    padding: 6px 12px;
    background: var(--surface);
    color: var(--text);
    font-weight: 600;
    font-variant-numeric: tabular-nums;
  }
  .field input[type="file"] {
    font-size: 13px;
    max-width: 280px;
  }
  .controls {
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
  }
  .btn-primary {
    border: 0;
    border-radius: 8px;
    background: var(--primary);
    color: #ffffff;
    font-weight: 600;
    min-height: 44px;
    padding: 10px 18px;
    transition: background 0.15s ease;
  }
  .btn-primary:hover:not(:disabled) {
    background: var(--primary-hover);
  }
  .btn-secondary {
    border: 1px solid var(--border-strong);
    border-radius: 8px;
    background: var(--surface);
    color: var(--text);
    font-weight: 600;
    min-height: 44px;
    padding: 10px 18px;
    transition: background 0.15s ease;
  }
  .btn-secondary:hover:not(:disabled) {
    background: var(--surface-muted);
  }
  button:disabled {
    opacity: 0.45;
    cursor: not-allowed;
  }
  .status-bar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 8px;
    margin-bottom: 12px;
    font-size: 14px;
    font-weight: 600;
    color: var(--text-muted);
  }
  .workspace {
    display: grid;
    grid-template-columns: minmax(0, 1.65fr) minmax(280px, 1fr);
    gap: 20px;
    align-items: stretch;
  }
  .stage-card {
    background: var(--stage-bg);
    border-radius: 12px;
    border: 1px solid var(--border-strong);
    overflow: hidden;
    display: flex;
    flex-direction: column;
    position: relative;
    aspect-ratio: 7 / 5;
    min-height: 260px;
  }
  .timer-track {
    height: 5px;
    width: 100%;
    background: rgba(255,255,255,0.12);
    overflow: hidden;
  }
  .timer-fill {
    height: 100%;
    width: 0%;
    background: #38bdf8;
    transition: width 0.1s linear;
  }
  .stage-viewport {
    flex: 1;
    display: grid;
    place-items: center;
    position: relative;
    width: 100%;
    height: 100%;
    overflow: hidden;
  }
  #image {
    width: 100%;
    height: 100%;
    object-fit: contain;
    display: none;
  }
  .placeholder {
    color: #e2e8f0;
    text-align: center;
    padding: 24px;
    line-height: 1.5;
    max-width: 85%;
    font-size: clamp(15px, 2vw, 18px);
  }
  .checklist-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 18px;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    gap: 14px;
  }
  .checklist-title {
    margin: 0;
    font-size: 16px;
    font-weight: 700;
  }
  .checkboxes {
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  .option-label {
    display: flex;
    gap: 12px;
    align-items: center;
    min-height: 54px;
    padding: 10px 14px;
    border: 1px solid var(--border-strong);
    border-radius: 10px;
    background: var(--bg);
    cursor: pointer;
    transition: all 0.15s ease;
    user-select: none;
  }
  .option-label:hover {
    border-color: var(--primary);
  }
  .option-label.checked {
    background: var(--primary-light);
    border-color: var(--primary);
  }
  .option-label input {
    width: 22px;
    height: 22px;
    flex: 0 0 22px;
    accent-color: var(--primary);
    margin: 0;
  }
  .option-text {
    display: flex;
    flex-direction: column;
    gap: 2px;
  }
  .option-primary {
    font-weight: 700;
    font-size: 15px;
    color: var(--text);
  }
  .option-secondary {
    font-size: 13px;
    color: var(--text-muted);
  }
  .key-badge {
    margin-left: auto;
    font-family: monospace;
    font-size: 12px;
    color: var(--text-muted);
    border: 1px solid var(--border-strong);
    border-radius: 4px;
    padding: 2px 6px;
    background: var(--surface);
  }
  .result-panel {
    display: none;
    background: var(--surface);
    border: 1px solid var(--border-strong);
    border-radius: 12px;
    padding: 24px;
    margin-top: 24px;
  }
  .result-panel.visible {
    display: block;
  }
  .result-banner {
    padding: 16px 20px;
    border-radius: 10px;
    margin-bottom: 20px;
    font-weight: 700;
    font-size: 18px;
  }
  .result-banner.pass {
    background: var(--success-bg);
    color: var(--success);
    border: 1px solid #a7f3d0;
  }
  .result-banner.fail {
    background: var(--danger-bg);
    color: var(--danger);
    border: 1px solid #fecaca;
  }
  .review-table {
    width: 100%;
    border-collapse: collapse;
    font-size: 14px;
  }
  .review-table th, .review-table td {
    padding: 10px 12px;
    border-bottom: 1px solid var(--border);
    text-align: left;
  }
  .review-table th {
    color: var(--text-muted);
    font-weight: 600;
    background: var(--surface-muted);
  }
  @media (max-width: 820px) {
    .workspace { grid-template-columns: 1fr; }
    .header-panel { flex-direction: column; align-items: stretch; }
    .controls { display: grid; grid-template-columns: 1fr 1fr; }
  }
</style>
</head>
<body>
  <header class="topbar">
    <div class="brand" id="appTitle">TEST VERKEHRSSITUATIONEN · SITUAȚII DE TRAFIC</div>
    <div class="lang-switch" role="group" aria-label="Language">
      <button type="button" class="lang-btn" data-lang="de">Deutsch</button>
      <button type="button" class="lang-btn" data-lang="ro">Română</button>
      <button type="button" class="lang-btn" data-lang="bi">DE + RO</button>
    </div>
  </header>

  <main class="container">
    <section class="header-panel">
      <div class="settings-group">
        <div class="field">
          <label for="displayTime" id="lblDuration">Dauer der Bildanzeige (Sek.)</label>
          <input type="number" id="displayTime" value="5" min="1" max="120" inputmode="numeric">
        </div>
        <div class="field">
          <label for="imageSourceMode" id="lblSource">Bildquelle</label>
          <select id="imageSourceMode">
            <option value="auto" id="optAuto">Ordner (bild1..10.jpg) / Upload + Fallback</option>
            <option value="builtin" id="optBuiltin">Integrierte Übungsszenen (1–10)</option>
          </select>
        </div>
        <div class="field">
          <label for="imageFiles" id="lblUpload">Eigene 10 Bilder wählen (optional)</label>
          <input id="imageFiles" type="file" accept="image/*" multiple>
        </div>
      </div>

      <div class="controls">
        <button id="startButton" type="button" class="btn-primary">Test starten</button>
        <button id="nextButton" type="button" class="btn-secondary" disabled>Nächstes Bild →</button>
      </div>
    </section>

    <div class="status-bar">
      <span id="status" aria-live="polite">Bereit für den Test · 10 Bilder</span>
      <span id="notice" aria-live="polite"></span>
    </div>

    <div class="workspace">
      <div class="stage-card">
        <div class="timer-track"><div class="timer-fill" id="timerFill"></div></div>
        <div class="stage-viewport" id="imageContainer">
          <img id="image" alt="Verkehrssituation">
          <div class="placeholder" id="placeholder">Das Bild erscheint hier nach dem Start des Tests.</div>
        </div>
      </div>

      <div class="checklist-card">
        <h2 class="checklist-title" id="checklistHeading">Was haben Sie auf dem Bild gesehen?</h2>
        <div class="checkboxes" id="checkboxes">
          <label class="option-label" id="lblWrap1">
            <input type="checkbox" id="option1">
            <span class="option-text">
              <span class="option-primary" id="optText1">Fußgänger, Kinder</span>
              <span class="option-secondary" id="optSub1"></span>
            </span>
            <span class="key-badge">1</span>
          </label>
          <label class="option-label" id="lblWrap2">
            <input type="checkbox" id="option2">
            <span class="option-text">
              <span class="option-primary" id="optText2">Autos</span>
              <span class="option-secondary" id="optSub2"></span>
            </span>
            <span class="key-badge">2</span>
          </label>
          <label class="option-label" id="lblWrap3">
            <input type="checkbox" id="option3">
            <span class="option-text">
              <span class="option-primary" id="optText3">Fahrrad, Motorrad, Moped</span>
              <span class="option-secondary" id="optSub3"></span>
            </span>
            <span class="key-badge">3</span>
          </label>
          <label class="option-label" id="lblWrap4">
            <input type="checkbox" id="option4">
            <span class="option-text">
              <span class="option-primary" id="optText4">Verkehrszeichen</span>
              <span class="option-secondary" id="optSub4"></span>
            </span>
            <span class="key-badge">4</span>
          </label>
          <label class="option-label" id="lblWrap5">
            <input type="checkbox" id="option5">
            <span class="option-text">
              <span class="option-primary" id="optText5">Ampel</span>
              <span class="option-secondary" id="optSub5"></span>
            </span>
            <span class="key-badge">5</span>
          </label>
        </div>
      </div>
    </div>

    <section id="resultPanel" class="result-panel" role="status" aria-live="polite">
      <div id="resultBanner" class="result-banner"></div>
      <div style="overflow-x:auto;">
        <table class="review-table">
          <thead>
            <tr>
              <th id="thImg">Bild</th>
              <th id="thSelected">Ihre Auswahl</th>
              <th id="thExpected">Richtige Lösung</th>
              <th id="thScore">Punkte</th>
            </tr>
          </thead>
          <tbody id="reviewBody"></tbody>
        </table>
      </div>
    </section>
  </main>

<script>
'use strict';
const correctAnswers = {
  1: [false, true, true, false, true],
  2: [true, true, false, true, false],
  3: [true, true, true, true, true],
  4: [true, false, true, true, true],
  5: [true, true, false, true, true],
  6: [false, true, false, true, true],
  7: [true, true, false, true, true],
  8: [true, true, false, true, false],
  9: [false, true, true, true, false],
  10: [true, true, false, true, true]
};

const categories = [
  { de: 'Fußgänger, Kinder', ro: 'Pietoni, copii' },
  { de: 'Autos', ro: 'Mașini' },
  { de: 'Fahrrad, Motorrad, Moped', ro: 'Bicicletă, motocicletă, moped' },
  { de: 'Verkehrszeichen', ro: 'Indicatoare rutiere' },

];

const i18n = {

    expired: 'Timpul a expirat! Bifează ce ai observat.',

    checklistHeading: 'Ce elemente ai observat în imagine?',
    imgProgress: (c, t) => 'Imaginea ' + c + ' din ' + t,
    pick10: 'Alege exact 10 imagini pentru cele 10 situații.',

    pass: (c, m, p) => 'Test trecut! Ai identificat corect ' + c + ' din ' + m + ' elemente (' + p + '%).',

    duration: 'Anzeigedauer / Durata afișării (s)',

    optAuto: 'Ordner / Folder (bild1..10.jpg) + Fallback',
    optBuiltin: 'Übungsszenen / Scene integrate (1–10)',

    loading: 'Wird geladen… / Se încarcă…',
    expired: 'Zeit abgelaufen! Bitte ankreuzen. / Timpul a expirat! Bifează ce ai observat.',
    ended: 'Test beendet. / Test încheiat.',
    checklistHeading: 'Erkannte Elemente / Elemente observate:',
    imgProgress: (c, t) => 'Bild / Imaginea ' + c + ' / ' + t,
    pick10: 'Bitte genau 10 Bilder wählen. / Alege exact 10 imagini.',
    loaded10: '10 Bilder geladen. / 10 imagini încărcate.',
    pass: (c, m, p) => 'Bestanden / Trecut! ' + c + ' / ' + m + ' (' + p + '%).',
    fail: (c, m, p) => 'Nicht bestanden / Picat. ' + c + ' / ' + m + ' (' + p + '%).',
    thImg: 'Bild / Img',

let lang = 'ro';
const totalImages = 10;
let currentImageIndex = 0;
let totalCorrectAnswersCount = 0;
let timer = null;
let session = 0;
let localUrls = [];
let historyLog = [];

const startButton = document.getElementById('startButton');
const nextButton = document.getElementById('nextButton');
const displayTimeInput = document.getElementById('displayTime');
const sourceSelect = document.getElementById('imageSourceMode');
const fileInput = document.getElementById('imageFiles');
const image = document.getElementById('image');
const placeholder = document.getElementById('placeholder');
const status = document.getElementById('status');
const notice = document.getElementById('notice');
const timerFill = document.getElementById('timerFill');
const resultPanel = document.getElementById('resultPanel');
const resultBanner = document.getElementById('resultBanner');
const reviewBody = document.getElementById('reviewBody');
const boxes = Array.from({length: 5}, (_, i) => document.getElementById('option' + (i + 1)));

function buildSvgScene(index) {
  const ans = correctAnswers[index] || [false, true, false, true, false];
  const [hasPed, hasCar, hasBike, hasSign, hasLight] = ans;
  const svg = '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 500" width="700" height="500">' +
    '<rect width="700" height="260" fill="#bae6fd"/>' +
    '<rect x="0" y="255" width="700" height="245" fill="#cbd5e1"/>' +
    '<polygon points="270,255 430,255 650,500 50,500" fill="#334155"/>' +
    '<line x1="350" y1="265" x2="350" y2="495" stroke="#f8fafc" stroke-width="6" stroke-dasharray="26 20"/>' +
    (hasCar ? '<g transform="translate(215,285)"><rect x="8" y="34" width="110" height="46" rx="10" fill="#2563eb"/><polygon points="24,36 40,8 88,8 104,36" fill="#1d4ed8"/><polygon points="29,34 43,12 85,12 98,34" fill="#bae6fd"/><rect x="14" y="46" width="18" height="11" rx="3" fill="#fef08a"/><rect x="94" y="46" width="18" height="11" rx="3" fill="#fef08a"/><rect x="12" y="74" width="22" height="14" rx="4" fill="#0f172a"/><rect x="92" y="74" width="22" height="14" rx="4" fill="#0f172a"/></g>' : '') +
    (hasBike ? '<g transform="translate(415,315)"><circle cx="24" cy="78" r="21" fill="none" stroke="#0f172a" stroke-width="6"/><circle cx="86" cy="78" r="21" fill="none" stroke="#0f172a" stroke-width="6"/><polyline points="24,78 48,48 76,48 52,78 24,78" fill="none" stroke="#f97316" stroke-width="5"/><circle cx="56" cy="12" r="12" fill="#eab308"/></g>' : '') +
    (hasPed ? '<g transform="translate(88,305)"><circle cx="32" cy="18" r="13" fill="#fed7aa"/><path d="M18,36 L46,36 L52,86 L12,86 Z" fill="#dc2626"/><circle cx="76" cy="44" r="10" fill="#fed7aa"/><path d="M65,58 L87,58 L91,94 L61,94 Z" fill="#0d9488"/></g>' : '') +
    (hasSign ? '<g transform="translate(565,165)"><rect x="36" y="75" width="8" height="190" fill="#64748b"/><polygon points="40,5 82,78 -2,78" fill="#ffffff" stroke="#dc2626" stroke-width="9"/><rect x="37" y="30" width="6" height="24" fill="#0f172a"/><circle cx="40" cy="63" r="4" fill="#0f172a"/></g>' : '') +
    (hasLight ? '<g transform="translate(75,105)"><rect x="28" y="128" width="9" height="190" fill="#475569"/><rect x="8" y="8" width="50" height="124" rx="10" fill="#0f172a" stroke="#f8fafc" stroke-width="3"/><circle cx="33" cy="32" r="14" fill="#ef4444"/><circle cx="33" cy="70" r="14" fill="#f59e0b"/><circle cx="33" cy="108" r="14" fill="#22c55e"/></g>' : '') +
    '</svg>';
  return 'data:image/svg+xml;utf8,' + encodeURIComponent(svg);
}

function updateLanguageUI() {
  const t = i18n[lang];
  document.getElementById('appTitle').textContent = t.title;
  document.getElementById('lblDuration').textContent = t.duration;
  document.getElementById('lblSource').textContent = t.source;
  document.getElementById('optAuto').textContent = t.optAuto;
  document.getElementById('optBuiltin').textContent = t.optBuiltin;
  document.getElementById('lblUpload').textContent = t.upload;
  startButton.textContent = t.start;
  nextButton.textContent = currentImageIndex === totalImages ? t.finish : t.next;
  document.getElementById('checklistHeading').textContent = t.checklistHeading;
  document.getElementById('thImg').textContent = t.thImg;
  document.getElementById('thSelected').textContent = t.thSelected;
  document.getElementById('thExpected').textContent = t.thExpected;
  document.getElementById('thScore').textContent = t.thScore;

  categories.forEach((cat, idx) => {
    const p = document.getElementById('optText' + (idx + 1));
    const s = document.getElementById('optSub' + (idx + 1));
    if (lang === 'de') {
      p.textContent = cat.de;
      s.textContent = '';
    } else if (lang === 'ro') {
      p.textContent = cat.ro;
      s.textContent = '';
    } else {
      p.textContent = cat.de;
      s.textContent = cat.ro;
    }
  });

  if (currentImageIndex === 0) {
    status.textContent = t.ready;
    if (image.style.display === 'none') {
      placeholder.textContent = t.placeholderStart;
    }
  } else {
    status.textContent = t.imgProgress(currentImageIndex, totalImages);
  }

  document.querySelectorAll('.lang-btn').forEach(btn => {
    btn.classList.toggle('active', btn.dataset.lang === lang);
  });
}

document.querySelectorAll('.lang-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    lang = btn.dataset.lang;
    updateLanguageUI();
  });
});

boxes.forEach((box, idx) => {
  box.addEventListener('change', () => {
    document.getElementById('lblWrap' + (idx + 1)).classList.toggle('checked', box.checked);
  });
});

function clearTimer() {
  if (timer !== null) {
    clearTimeout(timer);
    timer = null;
  }
  timerFill.style.transition = 'none';
  timerFill.style.width = '0%';
}

function cleanBoxes() {
  boxes.forEach((b, idx) => {
    b.checked = false;
    document.getElementById('lblWrap' + (idx + 1)).classList.remove('checked');
  });
}

function hideImage(message) {
  image.style.display = 'none';
  image.removeAttribute('src');
  placeholder.textContent = message;
  placeholder.hidden = false;
}

fileInput.addEventListener('change', () => {
  clearTimer();
  session++;
  const files = Array.from(fileInput.files || []).sort((a, b) =>
    a.name.localeCompare(b.name, undefined, { numeric: true, sensitivity: 'base' })
  );
  if (files.length && files.length !== totalImages) {
    notice.textContent = i18n[lang].pick10;
  } else if (files.length === totalImages) {
    localUrls = files.map(f => URL.createObjectURL(f));
    notice.textContent = i18n[lang].loaded10;
  }
  startButton.disabled = false;
  nextButton.disabled = true;
  currentImageIndex = 0;
  cleanBoxes();
  hideImage(i18n[lang].placeholderStart);
  resultPanel.classList.remove('visible');
});

function showImage(index) {
  clearTimer();
  const token = ++session;
  const seconds = Math.min(120, Math.max(1, parseInt(displayTimeInput.value, 10) || 5));
  displayTimeInput.value = seconds;
  placeholder.textContent = i18n[lang].loading;
  placeholder.hidden = false;
  image.style.display = 'none';

  const useBuiltin = sourceSelect.value === 'builtin';
  const primaryUrl = useBuiltin
    ? buildSvgScene(index)
    : (localUrls.length === 10 ? localUrls[index - 1] : 'bild' + index + '.jpg');

  image.onload = () => {
    if (token !== session) return;
    image.style.display = 'block';
    placeholder.hidden = true;
    requestAnimationFrame(() => {
      timerFill.style.transition = 'width ' + seconds + 's linear';
      timerFill.style.width = '100%';
    });
    timer = setTimeout(() => {
      if (token !== session) return;
      hideImage(i18n[lang].expired);
      timer = null;
    }, seconds * 1000);
  };

  image.onerror = () => {
    if (token !== session) return;
    // Automatic fallback to built-in SVG scene if bildX.jpg is missing in folder
    image.onerror = null;
    image.src = buildSvgScene(index);
  };

  image.src = primaryUrl;
}

function startTest() {
  clearTimer();
  currentImageIndex = 1;
  totalCorrectAnswersCount = 0;
  historyLog = [];
  cleanBoxes();
  resultPanel.classList.remove('visible');
  startButton.disabled = true;
  nextButton.disabled = false;
  updateLanguageUI();
  showImage(currentImageIndex);
}

function nextImage() {
  if (currentImageIndex < 1 || currentImageIndex > totalImages) return;
  const actual = boxes.map(b => b.checked);
  const expected = correctAnswers[currentImageIndex];
  const score = actual.filter((a, i) => a === expected[i]).length;
  totalCorrectAnswersCount += score;
  historyLog.push({ index: currentImageIndex, actual, expected, score });

  clearTimer();
  session++;

  if (currentImageIndex < totalImages) {
    currentImageIndex++;
    cleanBoxes();
    updateLanguageUI();
    showImage(currentImageIndex);
  } else {
    const max = totalImages * 5;
    const percentage = Math.round((totalCorrectAnswersCount / max) * 100);
    const t = i18n[lang];
    hideImage(t.ended);
    resultBanner.className = 'result-banner ' + (percentage >= 70 ? 'pass' : 'fail');
    resultBanner.textContent = percentage >= 70
      ? t.pass(totalCorrectAnswersCount, max, percentage)
      : t.fail(totalCorrectAnswersCount, max, percentage);

    reviewBody.innerHTML = historyLog.map(row => {
      const getNames = (arr) => {
        const names = arr
          .map((v, i) => v ? (lang === 'ro' ? categories[i].ro : categories[i].de) : null)
          .filter(Boolean);
        return names.length ? names.join(', ') : t.none;
      };
      return '<tr>' +
        '<td><strong>#' + row.index + '</strong></td>' +
        '<td>' + getNames(row.actual) + '</td>' +
        '<td>' + getNames(row.expected) + '</td>' +
        '<td><strong>' + row.score + ' / 5</strong></td>' +
      '</tr>';
    }).join('');

    resultPanel.classList.add('visible');
    startButton.disabled = false;
    nextButton.disabled = true;
    currentImageIndex = 0;
    updateLanguageUI();
    resultPanel.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
  }
}

window.addEventListener('keydown', (e) => {
  if (e.target.tagName === 'INPUT' && e.target.type === 'number') return;
  if (e.key >= '1' && e.key <= '5') {
    const idx = parseInt(e.key, 10) - 1;
    boxes[idx].checked = !boxes[idx].checked;
    boxes[idx].dispatchEvent(new Event('change'));
  }
});

startButton.addEventListener('click', startTest);
nextButton.addEventListener('click', nextImage);
updateLanguageUI();
</script>
</body>
</html>
